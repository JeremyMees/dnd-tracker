name: Validate

on:
  workflow_call:

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
        with:
          save-cache: "true"
      - name: Run eslint
        run: npm run lint

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
        with:
          prepare: "false"
      - name: Run prettier
        run: npm run format

  typechecking:
    name: Typechecking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run typechecking
        run: npm run typecheck

  testing:
    name: Testing ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run tests with coverage
        run: npm run test -- --shard=${{ matrix.shard }}/4 --coverage.reporter=json --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0
      - name: Rename coverage report for this shard
        run: mv coverage/coverage-final.json coverage/coverage-final-${{ matrix.shard }}.json
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/coverage-final-${{ matrix.shard }}.json
          retention-days: 1

  coverage-gate:
    name: Coverage Gate
    needs: testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v6
        with:
          path: coverage-raw
          pattern: coverage-shard-*
          merge-multiple: true
      - name: Merge reports and enforce thresholds
        run: npm run test:coverage:gate
